name: Mediverse Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]

jobs:
  security-sast:
    name: Security SAST & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_RULES: p/security-audit p/owasp-top-ten p/secrets

  backend:
    name: Backend Build, Test & JaCoCo Quality Gate
    runs-on: ubuntu-latest
    needs: [security-sast]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mediverse_db
          POSTGRES_USER: mediverse_user
          POSTGRES_PASSWORD: mediverse_secure_password123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/mediverse_db
      SPRING_DATASOURCE_USERNAME: mediverse_user
      SPRING_DATASOURCE_PASSWORD: mediverse_secure_password123
      SPRING_DATA_REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: c3VwZXItc2VjcmV0LWtleS1zaG91bGQtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3Itc2VjdXJpdHk=

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build & Run Unit/Integration Tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Verify JaCoCo Code Coverage (Threshold >= 80%)
        working-directory: backend
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload Backend Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/

  frontend:
    name: Frontend Build, Lint & Jest Quality Gate
    runs-on: ubuntu-latest
    needs: [security-sast]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Next.js Codebase
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run Jest Component & E2E Tests (Threshold >= 80%)
        working-directory: frontend
        run: npm test -- --ci --maxWorkers=2

      - name: Build Production Next.js Bundle
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Upload Frontend Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifacts
          path: frontend/.next/

  trivy-scan:
    name: Container Vulnerability Scan (Trivy SCA)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
