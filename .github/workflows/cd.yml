name: Mediverse Continuous Delivery (CD)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}-frontend

jobs:
  build-and-push:
    name: Build & Push Production Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Extract Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging Kubernetes Cluster
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Client Dry-Run Manifest Validation
        run: |
          echo "Executing client-side dry-run validation against all Kubernetes manifests..."
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/

      - name: Staging Rollout Execution
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            echo "KUBECONFIG secret detected. Configuring cluster context..."
            mkdir -p ~/.kube
            echo "$KUBECONFIG_DATA" | base64 --decode > ~/.kube/config
            chmod 600 ~/.kube/config

            echo "Applying Kubernetes manifests with pinned commit SHA image tags: $IMAGE_TAG"
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/
            kubectl set image deployment/mediverse-backend backend=${{ env.IMAGE_BACKEND }}:$IMAGE_TAG -n mediverse
            kubectl set image deployment/mediverse-frontend frontend=${{ env.IMAGE_FRONTEND }}:$IMAGE_TAG -n mediverse

            echo "Verifying rollout status..."
            kubectl rollout status deployment/mediverse-backend -n mediverse --timeout=180s
            kubectl rollout status deployment/mediverse-frontend -n mediverse --timeout=180s
            echo "Staging Deployment Succeeded."
          else
            echo "NOTICE: KUBECONFIG secret is not configured in this repository environment."
            echo "Client-side manifest dry-run succeeded. Skipping live cluster deployment until cluster credentials are provisioned."
          fi
