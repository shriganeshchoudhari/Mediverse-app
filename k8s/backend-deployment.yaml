apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediverse-backend
  namespace: mediverse
  labels:
    app.kubernetes.io/name: mediverse-backend
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mediverse-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediverse-backend
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/shriganeshchoudhari/mediverse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http-api
          envFrom:
            - configMapRef:
                name: mediverse-config
            - secretRef:
                name: mediverse-secrets
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 25
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mediverse-backend
  namespace: mediverse
  labels:
    app.kubernetes.io/name: mediverse-backend
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 8085
      name: http-api
  selector:
    app.kubernetes.io/name: mediverse-backend
