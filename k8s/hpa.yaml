apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediverse-backend-hpa
  namespace: mediverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediverse-backend
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediverse-frontend-hpa
  namespace: mediverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediverse-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
