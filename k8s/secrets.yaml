# NOTE: In production environments, secrets must be injected via Sealed Secrets,
# External Secrets Operator (AWS Secrets Manager / HashiCorp Vault), or CI/CD pipelines.
# Do NOT commit production credential values directly into this manifest.
apiVersion: v1
kind: Secret
metadata:
  name: mediverse-secrets
  namespace: mediverse
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "REPLACE_VIA_SECRET_MANAGER"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_VIA_SECRET_MANAGER"
  JWT_SECRET: "REPLACE_VIA_SECRET_MANAGER"
  GEMINI_API_KEY: "REPLACE_VIA_SECRET_MANAGER"

