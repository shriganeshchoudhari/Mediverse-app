apiVersion: batch/v1
kind: CronJob
metadata:
  name: mediverse-postgres-backup
  namespace: mediverse
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/mediverse_db_${TIMESTAMP}.dump.gz"
                  echo "Starting PostgreSQL backup: ${BACKUP_FILE}"
                  
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -F c -b -v | gzip > "${BACKUP_FILE}"
                  
                  echo "Backup complete. Size: $(du -sh ${BACKUP_FILE} | cut -f1)"
                  
                  # Prune local backups older than 14 days
                  find /backups -name "mediverse_db_*.dump.gz" -type f -mtime +14 -delete
                  echo "Old backup pruning cycle completed."
              env:
                - name: POSTGRES_HOST
                  value: "postgres"
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: "mediverse_db"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: mediverse-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mediverse-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
