services:
  # ============================================================
  # 1. Primary Relational & Vector Database (PostgreSQL 16 + pgvector)
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediverse_db
      POSTGRES_USER: mediverse_user
      POSTGRES_PASSWORD: mediverse_secure_password123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediverse_user -d mediverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. Redis In-Memory Cache & WebSocket Pub/Sub Broker
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: mediverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ============================================================
  # 3. Elasticsearch Full-Text Medical Search Engine
  # ============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: mediverse-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ============================================================
  # 4. Spring Boot Backend API (Port 8085)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediverse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediverse_db
      SPRING_DATASOURCE_USERNAME: mediverse_user
      SPRING_DATASOURCE_PASSWORD: mediverse_secure_password123
      SPRING_DATA_REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      PORT: 8085
    ports:
      - "8085:8085"

  # ============================================================
  # 5. Next.js Medical Platform Frontend (Port 3000)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediverse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8085
      NEXT_PUBLIC_API_URL: http://localhost:8085
      PORT: 3000
    ports:
      - "3000:3000"

  # ============================================================
  # 6. Prometheus Metrics Scraper (Port 9090)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: mediverse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  # ============================================================
  # 7. Grafana Metrics & Operational Dashboard (Port 3002)
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: mediverse-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  es_data:
