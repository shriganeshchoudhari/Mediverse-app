groups:
  - name: mediverse_alerts
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected on Mediverse backend"
          description: "HTTP 5xx error rate is above 5% (current: {{ $value | humanizePercentage }}) over the last 5 minutes."

      - alert: SlowResponseLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Elevated p95 API response latency"
          description: "p95 API response latency exceeds 2000ms (current: {{ $value }}s) over the last 5 minutes."

      - alert: HikariPoolSaturation
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near saturation"
          description: "Active Hikari connections exceed 85% of maximum capacity."

      - alert: HighJvmHeapUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High JVM Heap Memory Usage"
          description: "JVM Heap usage is above 85% of allocated maximum."

      - alert: AICircuitBreakerTripped
        expr: circuit_breaker_state{name="GeminiLLM"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Gemini AI Tutor Circuit Breaker is OPEN"
          description: "Circuit breaker tripped due to consecutive failures. Fallback pedagogical engine is active."
