groups:
  - name: mediverse_alerts
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected on Mediverse backend"
          description: "HTTP 5xx error rate is above 5% (current: {{ $value | humanizePercentage }}) over the last 5 minutes."

      - alert: SlowResponseLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Elevated p95 API response latency"
          description: "p95 API response latency exceeds 500ms (current: {{ $value }}s) over the last 5 minutes, risking curriculum SLO breach."

      - alert: HikariPoolSaturation
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near saturation"
          description: "Active Hikari connections exceed 85% of maximum capacity."

      - alert: HighJvmHeapUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High JVM Heap Memory Usage"
          description: "JVM Heap usage is above 85% of allocated maximum."

      - alert: HighAiServiceErrorRate
        expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/ai/.*",status=~"5.."}[5m])) / (sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/ai/.*"}[5m])) > 0 or 1) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on AI Socratic Tutor service"
          description: "HTTP 5xx error rate on /api/v1/ai/* endpoints exceeds 10% over the last 5 minutes."

      - alert: HighAiTutorLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{uri=~"/api/v1/ai/.*"}[5m])) by (le)) > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated AI Tutor Socratic response latency"
          description: "p95 latency on /api/v1/ai/* exceeds 1500ms (current: {{ $value }}s), violating Tier 2 TTFT SLO."

      - alert: SloBurnRateFast
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[1h])) / sum(rate(http_server_requests_seconds_count[1h]))) > (14.4 * (1 - 0.9995))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Rapid Error Budget Burn Rate (1h window)"
          description: "API Gateway error budget is burning at 14.4x rate (consuming >2% budget in 1 hour)."

      - alert: SloBurnRateSlow
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[6h])) / sum(rate(http_server_requests_seconds_count[6h]))) > (6 * (1 - 0.9995))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Slow Sustained Error Budget Burn Rate (6h window)"
          description: "API Gateway error budget is burning at 6x rate (consuming >5% budget in 6 hours)."
